<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="favBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <!-- High-contrast rounded background -->
  <rect width="64" height="64" rx="16" fill="url(#favBg)" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="url(#favGold)" stroke-width="2.5" />

  <!-- Bold Architectural Roof Apex / Gable -->
  <path d="M 32 10 L 52 25 L 46 25 L 32 15 L 18 25 L 12 25 Z" fill="url(#favGold)" />

  <!-- Left Pillar of 'H' -->
  <rect x="19" y="24" width="7" height="28" rx="1.5" fill="url(#favBlue)" />

  <!-- Right Pillar of 'H' -->
  <rect x="38" y="24" width="7" height="28" rx="1.5" fill="url(#favBlue)" />

  <!-- Horizon Bar -->
  <rect x="12" y="35" width="40" height="4.5" rx="2" fill="url(#favGold)" />

  <!-- Base Accent -->
  <rect x="16" y="52" width="32" height="2.5" rx="1.25" fill="url(#favBlue)" opacity="0.9" />
</svg>
